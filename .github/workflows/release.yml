name: Release

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Tipe kenaikan versi (otomatis deteksi dari rilis terakhir)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
          - custom
      custom_version:
        description: 'Versi custom (hanya jika memilih bump_type: custom, contoh: 1.2.0)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build & Publish Release
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: |
          for xcode in /Applications/Xcode_16*.app /Applications/Xcode_15*.app; do
            if [ -d "$xcode" ]; then
              echo "Selecting $xcode"
              sudo xcode-select -s "$xcode"
              break
            fi
          done
          xcodebuild -version

      - name: Calculate Next Version
        id: version
        run: |
          git fetch --tags --force
          LATEST_TAG=$(git tag -l "v*" | sort -V | tail -n 1)
          BUMP_TYPE="${{ github.event.inputs.bump_type }}"
          CUSTOM_INPUT="${{ github.event.inputs.custom_version }}"

          echo "Latest tag found: '$LATEST_TAG'"
          echo "Selected bump type: '$BUMP_TYPE'"

          if [ "$BUMP_TYPE" = "custom" ] && [ -n "$CUSTOM_INPUT" ]; then
            CLEAN_VERSION="${CUSTOM_INPUT#v}"
          elif [ -z "$LATEST_TAG" ]; then
            # Rilis perdana jika belum ada tag di repositori
            CLEAN_VERSION="1.0.0"
          else
            CLEAN="${LATEST_TAG#v}"
            IFS="." read -r MAJOR MINOR PATCH <<< "$CLEAN"
            MAJOR=${MAJOR:-1}
            MINOR=${MINOR:-0}
            PATCH=${PATCH:-0}

            case "$BUMP_TYPE" in
              patch)
                PATCH=$((PATCH + 1))
                ;;
              minor)
                MINOR=$((MINOR + 1))
                PATCH=0
                ;;
              major)
                MAJOR=$((MAJOR + 1))
                MINOR=0
                PATCH=0
                ;;
              *)
                PATCH=$((PATCH + 1))
                ;;
            esac
            CLEAN_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi

          TAG_NAME="v${CLEAN_VERSION}"
          echo "Computed new version: $CLEAN_VERSION"
          echo "Computed tag: $TAG_NAME"

          echo "version=$CLEAN_VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Verify Tag Does Not Already Exist
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Error: Tag $TAG already exists!"
            exit 1
          fi

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build and Archive
        run: |
          xcodebuild clean archive \
            -project Harmonotch.xcodeproj \
            -scheme Harmonotch \
            -configuration Release \
            -archivePath $PWD/build/Harmonotch.xcarchive \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Ad-Hoc Code Sign
        run: |
          APP_PATH="build/Harmonotch.xcarchive/Products/Applications/Harmonotch.app"
          echo "Signing app ad-hoc to ensure native execution on Apple Silicon..."
          codesign --force --deep -s - "$APP_PATH"
          codesign -vvv --deep --strict "$APP_PATH"

      - name: Create DMG Installer
        run: |
          APP_PATH="build/Harmonotch.xcarchive/Products/Applications/Harmonotch.app"
          DMG_NAME="Harmonotch-${{ steps.version.outputs.version }}.dmg"
          echo "DMG_NAME=$DMG_NAME" >> $GITHUB_ENV

          create-dmg \
            --volname "Harmonotch Installer" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "Harmonotch.app" 150 190 \
            --hide-extension "Harmonotch.app" \
            --app-drop-link 450 190 \
            "$DMG_NAME" \
            "$APP_PATH"

      - name: Generate Checksums
        run: |
          shasum -a 256 "${{ env.DMG_NAME }}" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Generate Install Guide
        run: |
          cat << 'EOF' > INSTALL_GUIDE.txt
          =========================================================
          Harmonotch Installation Guide (macOS)
          =========================================================

          1. Buka file installer DMG yang telah diunduh.
          2. Drag & drop "Harmonotch.app" ke dalam folder "Applications".
          3. Jika macOS menampilkan pesan Gatekeeper ("Harmonotch cannot be opened because Apple cannot check it for malicious software" / "damaged"):
             - Buka Terminal (Cmd + Space, ketik "Terminal")
             - Jalankan perintah berikut:
                 xattr -cr /Applications/Harmonotch.app
          4. Buka kembali Harmonotch dari Launchpad atau Applications.
          =========================================================
          EOF

      - name: Push Git Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Harmonotch ${{ steps.version.outputs.tag }}
          files: |
            ${{ env.DMG_NAME }}
            SHA256SUMS.txt
            INSTALL_GUIDE.txt
          generate_release_notes: true
