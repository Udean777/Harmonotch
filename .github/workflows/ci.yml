name: CI

on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Verify
    # Same toolchain as the release build.
    runs-on: xcode-27
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # `nonisolated` on types (used by the now-playing bridge) needs Swift 6.1+.
          xcode=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -vi beta | sort -V | tail -n 1)
          if [ -n "$xcode" ]; then
            echo "Selecting $xcode"
            sudo xcode-select -s "$xcode"
          fi
          xcodebuild -version

      - name: Ensure Xcode Project Compatibility
        run: |
          sed -i '' 's/objectVersion = 110;/objectVersion = 77;/' Harmonotch.xcodeproj/project.pbxproj || true
          sed -i '' 's/MACOSX_DEPLOYMENT_TARGET = [0-9.]*;/MACOSX_DEPLOYMENT_TARGET = 14.0;/' Harmonotch.xcodeproj/project.pbxproj || true

      - name: Check Web Scripts
        run: |
          node --check web/js/main.js
          node --check web/api/download.js

      - name: Run Tests
        run: ./Tests/run-tests.sh

      - name: Build Harmonotch (Debug)
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project Harmonotch.xcodeproj \
            -scheme Harmonotch \
            -configuration Debug \
            -derivedDataPath build/dd \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee xcodebuild.log || {
              echo "::error::Build failed! Printing compile errors from log:"
              grep -E "(error:|fatal error:)" xcodebuild.log || tail -n 100 xcodebuild.log
              exit 1
            }

      - name: Verify Media bridge in bundle
        run: |
          APP="build/dd/Build/Products/Debug/Harmonotch.app"
          test -f "$APP/Contents/Frameworks/libHarmonotchNowPlaying.dylib"
          test -f "$APP/Contents/Resources/nowplaying.pl"
          perl -c "$APP/Contents/Resources/nowplaying.pl"
          codesign --verify "$APP/Contents/Frameworks/libHarmonotchNowPlaying.dylib"
